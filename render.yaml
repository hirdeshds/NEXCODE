services:
  - type: web
    name: nexcode-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: "cohere"
      - key: COHERE_MODEL
        value: "command-r-08-2024"
      - key: PIPELINE_WORKER_COUNT
        value: "2"
      - key: COHERE_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
